    const ROUNDS = 120000;
    const KEY = 'sf-fd-support-concept-v1';
    const bytes = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    async function openWith(password) {
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(SALT), iterations: ROUNDS, hash: 'SHA-256' },

        ['decrypt']
      );
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));

      document.write(html);
      document.close();

      err.textContent = '';
      const password = document.getElementById('pw').value;
      try { await openWith(password); }
