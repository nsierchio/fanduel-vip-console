      document.open();
      document.write(html);
      document.close();
    }
    const form = document.getElementById('gate');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const password = document.getElementById('pw').value;
      try { await openWith(password); }
      catch { err.textContent = 'That password does not open this prototype.'; }
    });
    const saved = sessionStorage.getItem(KEY);
    if (saved) openWith(saved).catch(() => sessionStorage.removeItem(KEY));
  </script>
</body>
</html>
