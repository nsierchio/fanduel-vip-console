    const ROUNDS = 120000;
    const KEY = 'sf-fd-support-concept-v1';
    const bytes = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    async function openWith(password) {
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(SALT), iterations: ROUNDS, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
      sessionStorage.setItem(KEY, password);
      const html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    }
    const form = document.getElementById('gate');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const password = document.getElementById('pw').value;
      try { await openWith(password); }
      catch { err.textContent = 'That password does not open this prototype.'; }
    });
    const saved = sessionStorage.getItem(KEY);
    if (saved) openWith(saved).catch(() => sessionStorage.removeItem(KEY));
